<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFF9F7">
  <title>Admin workspace | GlowCart</title>
  <link rel="icon" type="image/png" href="Resources/Logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/admin.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="index.html"><img src="Resources/Logo.png" alt=""><span>GlowCart <small>ADMIN</small></span></a><div class="top-actions"><span class="admin-name" id="admin-name"></span><button class="logout" id="logout">Sign out</button></div></header>
  <div class="app-shell"><aside class="sidebar"><div class="side-label">Workspace</div><nav class="side-nav" aria-label="Admin sections"><button class="active" data-view="overview"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="11" width="7" height="10"/><rect x="3" y="14" width="8" height="7"/></svg>Overview</button><button data-view="products"><svg viewBox="0 0 24 24"><path d="M4 7h16l1 14H3L4 7Z"/><path d="M8 8V5a4 4 0 0 1 8 0v3"/></svg>Products</button><button data-view="categories"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h16"/><circle cx="8" cy="5" r="2" fill="var(--ivory)"/><circle cx="16" cy="12" r="2" fill="var(--ivory)"/><circle cx="10" cy="19" r="2" fill="var(--ivory)"/></svg>Categories</button><button data-view="orders"><svg viewBox="0 0 24 24"><path d="M5 4h14v17H5zM8 8h8M8 12h8M8 16h5"/></svg>Orders</button><button data-view="customers"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M17 5a3 3 0 0 1 0 6m1.5 3a5 5 0 0 1 3 4.5"/></svg>Customers</button></nav><div class="sidebar-note"><strong>Demo workspace</strong><br>Changes are stored in this browser only. Connect a Java backend before using real customer data.</div></aside><main class="main" id="admin-content"></main></div>
  <div class="modal-wrap" id="product-modal" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="product-modal-title"><button class="close" data-close aria-label="Close">×</button><h2 id="product-modal-title">Add product</h2><p>Product details update the customer storefront catalog.</p><form id="product-form"><div class="field"><label for="product-name">Product name</label><input id="product-name" required></div><div class="form-row"><div class="field"><label for="product-brand">Brand</label><input id="product-brand" required></div><div class="field"><label for="product-price">Price</label><input id="product-price" type="number" min="0.01" step="0.01" required></div></div><div class="form-row"><div class="field"><label for="product-category">Category</label><select id="product-category"></select></div><div class="field"><label for="product-stock">Stock</label><input id="product-stock" type="number" min="0" step="1" required></div></div><div class="field"><label for="product-image-url">Image URL</label><input id="product-image-url" type="url" placeholder="https://..."></div><div class="field"><label for="product-image-file">Or upload an image (up to 1.5 MB)</label><input id="product-image-file" type="file" accept="image/jpeg,image/png,image/webp"></div><button class="primary-button" type="submit">Save product</button></form></section></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="catalog.js"></script><script src="auth.js"></script>
  <script src="scripts/admin.js"></script>
</body>
</html>
